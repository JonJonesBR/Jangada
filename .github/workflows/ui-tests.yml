name: Testes no emulador

# Roda só sob demanda (botão "Run workflow") e nas tags v*. Leva uns 15 minutos (a instalação do Debian no emulador é a maior parte) (o emulador
# sobe do zero a cada vez), então não roda em cada push: o build.yml já cobre os testes de unidade.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

# Sem secrets: testa o APK de depuração num emulador limpo, sem nenhum dado do usuário.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Sem KVM o emulador roda devagar demais para os testes.
      - name: Ligar a aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # O emulador é x86_64: o app precisa do proot dessa arquitetura (o build.yml baixa as duas).
      - name: Baixar proot do Termux
        run: bash scripts/fetch-proot.sh x86_64
      # Os agentes falsos dos testes (bash) precisam ao menos ser bash válido.
      - name: Conferir os agentes falsos
        run: for f in app/src/androidTest/assets/fakes/*; do bash -n "$f"; done
      - name: Compilar o app e os testes
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      # Testes de interface: só telas que não precisam do Linux (no x86_64 ele não instala).
      - name: Rodar os testes no emulador
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          # O Debian (~400 MB com o git e o curl) e o apt precisam de espaço e memória.
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # Se algum teste falhar, guarda o logcat do emulador (limpo, sem dado de ninguém) junto do relatório.
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest || { mkdir -p app/build/reports/androidTests; adb logcat -d > app/build/reports/androidTests/logcat.txt; exit 1; }
      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Relatorio-emulador
          path: app/build/reports/androidTests/
          retention-days: 14
